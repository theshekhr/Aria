<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aria — Chat History</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: transparent; height: 100vh; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#app {
  background: rgba(18,18,22,0.97); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; width: 100%; height: 100vh; display: flex; flex-direction: column;
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 24px 64px rgba(0,0,0,0.6); color: #e0e2e8; overflow: hidden;
}
#titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 15px; -webkit-app-region: drag;
  border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
}
#tl-left { display: flex; align-items: center; gap: 8px; }
#tl-title { font-size: 14px; font-weight: 600; color: #f0f2f6; }
#tl-count { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.4); }
#tl-right { display: flex; gap: 4px; -webkit-app-region: no-drag; }
.tb-btn {
  height: 28px; border-radius: 7px; border: none; background: transparent;
  color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 12px; padding: 0 8px; transition: all 0.15s; white-space: nowrap;
}
.tb-btn:hover { background: rgba(255,255,255,0.09); color: #fff; }
#close-btn:hover { background: rgba(196,43,28,0.7); color: #fff; }
.tb-btn.danger:hover { background: rgba(234,67,53,0.2); color: #ea4335; }

#search-bar {
  padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
}
#search {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 8px; padding: 7px 12px; font-size: 13px; color: #e0e2e8;
  outline: none; font-family: inherit; -webkit-user-select: text; user-select: text;
  transition: border-color 0.15s;
}
#search:focus { border-color: rgba(66,133,244,0.5); }
#search::placeholder { color: rgba(255,255,255,0.22); }

#list {
  flex: 1; overflow-y: auto; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
#list::-webkit-scrollbar { width: 3px; }
#list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

.entry {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px; padding: 11px 13px; cursor: pointer; transition: all 0.15s;
}
.entry:hover { background: rgba(255,255,255,0.08); border-color: rgba(66,133,244,0.3); }
.entry-time { font-size: 10.5px; color: rgba(255,255,255,0.28); margin-bottom: 5px; }
.entry-user {
  font-size: 13px; color: #e0e4ee; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
}
.entry-ai {
  font-size: 12px; color: rgba(255,255,255,0.4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Expanded entry */
.entry.expanded { cursor: default; }
.entry.expanded .entry-user { white-space: normal; margin-bottom: 8px; }
.entry.expanded .entry-ai   { white-space: normal; color: rgba(255,255,255,0.6); line-height: 1.55; }
.entry-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 8px 0; }

#empty {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; gap: 10px; color: rgba(255,255,255,0.25); font-size: 13px;
}
#empty-icon { font-size: 36px; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div id="tl-left">
      <span>🕓</span>
      <span id="tl-title">Chat History</span>
      <span id="tl-count">0 conversations</span>
    </div>
    <div id="tl-right">
      <button class="tb-btn danger" onclick="clearAll()">🗑 Clear all</button>
      <button class="tb-btn" id="close-btn" onclick="window.aria.closeHistory()">✕</button>
    </div>
  </div>

  <div id="search-bar">
    <input id="search" placeholder="Search conversations…" oninput="filterList(this.value)" />
  </div>

  <div id="list"></div>
  <div id="empty">
    <div id="empty-icon">💬</div>
    <div>No conversations yet</div>
    <div style="font-size:11px">Your chats will appear here</div>
  </div>
</div>

<script>
let allHistory = [];

(async () => {
  allHistory = await window.aria.loadHistory() || [];
  render(allHistory);
})();

function render(items) {
  const list  = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('tl-count');

  count.textContent = items.length + ' conversation' + (items.length !== 1 ? 's' : '');
  list.innerHTML = '';

  if (items.length === 0) {
    empty.style.display = 'flex';
    list.style.display  = 'none';
    return;
  }

  empty.style.display = 'none';
  list.style.display  = 'flex';

  items.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'entry';

    const date = new Date(item.timestamp);
    const timeStr = date.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })
                  + ' · ' + date.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });

    el.innerHTML = `
      <div class="entry-time">${timeStr}</div>
      <div class="entry-user">👤 ${escape(item.user)}</div>
      <div class="entry-divider"></div>
      <div class="entry-ai">🤖 ${escape(item.ai)}</div>
    `;

    // Click to expand/collapse
    el.onclick = () => {
      el.classList.toggle('expanded');
    };

    list.appendChild(el);
  });
}

function escape(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function filterList(query) {
  if (!query.trim()) { render(allHistory); return; }
  const q = query.toLowerCase();
  render(allHistory.filter(h =>
    (h.user || '').toLowerCase().includes(q) ||
    (h.ai   || '').toLowerCase().includes(q)
  ));
}

async function clearAll() {
  if (!confirm('Clear all chat history? This cannot be undone.')) return;
  await window.aria.clearHistory();
  allHistory = [];
  render([]);
}
</script>
</body>
</html>
