<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aria</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: transparent; height: 100vh; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#app {
  background: rgba(15,15,18,0.95);
  border: 1px solid rgba(255,255,255,0.09); border-radius: 16px;
  width: 100%; height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 24px 64px rgba(0,0,0,0.55); color: #e0e2e8;
}

/* Titlebar */
#titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; -webkit-app-region: drag; flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
#tl-left { display: flex; align-items: center; gap: 7px; }
#pulse {
  width: 8px; height: 8px; border-radius: 50%; background: #4285F4;
  box-shadow: 0 0 8px #4285F4cc; animation: pulse 2.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{box-shadow:0 0 6px #4285F4aa;} 50%{box-shadow:0 0 16px #4285F4ff;} }
#app-name { font-size: 14px; font-weight: 600; color: #f0f2f6; }
.badge {
  font-size: 10px; padding: 2px 6px; border-radius: 5px;
  border: 1px solid rgba(66,133,244,0.3); background: rgba(66,133,244,0.1); color: #4285F4;
}
.badge.hotkey { border-color: rgba(255,255,255,0.08); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.28); }
#tl-right { display: flex; gap: 2px; -webkit-app-region: no-drag; }
.tb-btn {
  width: 28px; height: 28px; border-radius: 7px; border: none;
  background: transparent; color: rgba(255,255,255,0.4); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s;
}
.tb-btn:hover { background: rgba(255,255,255,0.09); color: #fff; }
#close-btn:hover { background: rgba(196,43,28,0.7); color: #fff; }

/* Screen bar */
#screen-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;
}
#scr-thumb {
  width: 50px; height: 32px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(66,133,244,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; overflow: hidden;
}
#scr-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
#scr-info { flex: 1; min-width: 0; }
#scr-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.28); margin-bottom: 1px; }
#scr-name  { font-size: 11.5px; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cap-btn {
  font-size: 11.5px; padding: 5px 11px; border-radius: 7px;
  border: 1px solid rgba(66,133,244,0.4); background: rgba(66,133,244,0.12); color: #6ba3f5;
  cursor: pointer; white-space: nowrap; font-weight: 500; transition: all 0.15s; font-family: inherit;
}
#cap-btn:hover  { background: rgba(66,133,244,0.28); color: #90beff; }
#cap-btn:active { transform: scale(0.95); }
#cap-btn:disabled { opacity: 0.35; cursor: default; }

/* Messages */
#messages {
  flex: 1; overflow-y: auto; padding: 12px 12px 6px;
  display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
}
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.msg-row { display: flex; gap: 8px; align-items: flex-start; animation: fadeUp 0.2s ease; }
.msg-row.user { flex-direction: row-reverse; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.av {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
}
.av.ai   { background: transparent; overflow: hidden; border: none; }
.av.user { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.1); }
.msg-wrap { display: flex; flex-direction: column; }
.msg-wrap.user { align-items: flex-end; }
.bubble {
  max-width: 272px; padding: 8px 12px; border-radius: 12px;
  font-size: 13px; line-height: 1.55;
}
.bubble.ai   { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.07); color: #d8dce6; border-top-left-radius: 3px; }
.bubble.user { background: #4285F4; color: #fff; border-top-right-radius: 3px; }
.scr-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
  color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 5px; margin-bottom: 4px;
}
.img-thumb { max-width: 230px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); display: block; margin-bottom: 4px; }
.dots { display: flex; gap: 4px; padding: 4px 2px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); animation: bounce 1.2s infinite; }
.dots span:nth-child(2){animation-delay:.2s;} .dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

/* Input area */
#input-area { padding: 7px 11px 11px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
#api-banner {
  display: none; margin-bottom: 7px; padding: 6px 10px; border-radius: 8px;
  background: rgba(255,170,0,0.09); border: 1px solid rgba(255,170,0,0.22);
  font-size: 11.5px; color: #f0b850; cursor: pointer;
}
#api-banner:hover { background: rgba(255,170,0,0.15); }
#chips { display: flex; gap: 5px; margin-bottom: 7px; overflow-x: auto; flex-wrap: nowrap; }
#chips::-webkit-scrollbar { display: none; }
.chip {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.45); cursor: pointer; white-space: nowrap;
  transition: all 0.15s; font-family: inherit;
}
.chip:hover { background: rgba(255,255,255,0.11); color: #fff; }

/* Input row with voice btn */
#input-row {
  display: flex; align-items: flex-end; gap: 5px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 10px; padding: 7px 7px 7px 12px; transition: border-color 0.15s;
}
#input-row:focus-within { border-color: rgba(66,133,244,0.55); }
#input {
  flex: 1; border: none; background: transparent; font-size: 13px; color: #dde0e8;
  outline: none; font-family: inherit; resize: none; line-height: 1.5;
  max-height: 80px; min-height: 20px; -webkit-user-select: text; user-select: text;
}
#input::placeholder { color: rgba(255,255,255,0.22); }

/* Voice button */
#voice-btn {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.45);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0; transition: all 0.15s;
}
#voice-btn:hover { background: rgba(255,255,255,0.13); color: #fff; }
#voice-btn.recording { background: rgba(234,67,53,0.25); color: #ea4335; animation: recPulse 1s infinite; }
@keyframes recPulse { 0%,100%{box-shadow:0 0 0 0 rgba(234,67,53,0.4);} 50%{box-shadow:0 0 0 6px rgba(234,67,53,0);} }

#send-btn {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: #4285F4; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0; transition: all 0.15s; font-weight: bold;
}
#send-btn:hover  { background: #3367d6; }
#send-btn:active { transform: scale(0.92); }
#send-btn:disabled { background: rgba(255,255,255,0.08); cursor: default; }

/* Voice status */
#voice-status {
  font-size: 11px; color: #ea4335; text-align: center;
  padding: 3px 0 0; display: none;
}
#voice-status.show { display: block; }
</style>
</head>
<body>
<div id="app">

  <div id="titlebar">
    <div id="tl-left">
      <div id="pulse"></div>
      <span id="app-name">Aria</span>
      <span class="badge">✦ Gemini</span>
      <span class="badge hotkey">Alt+Space</span>
    </div>
    <div id="tl-right">
      <button class="tb-btn" title="Chat History" onclick="window.aria.openHistory()">🕓</button>
      <button class="tb-btn" title="Settings"     onclick="window.aria.openSettings()">⚙</button>
      <button class="tb-btn" id="close-btn" title="Hide" onclick="window.aria.hideWindow()">✕</button>
    </div>
  </div>

  <div id="screen-bar">
    <div id="scr-thumb">🖥</div>
    <div id="scr-info">
      <div id="scr-label">Screen context</div>
      <div id="scr-name">No capture yet — press Capture or Alt+Q</div>
    </div>
    <button id="cap-btn" onclick="captureScreen()">📸 Capture</button>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div id="api-banner" onclick="window.aria.openSettings()">
      ⚠ No Gemini API key — click here to add one (free!)
    </div>
    <div id="chips">
      <button class="chip" onclick="chip('Explain what you see on my screen')">Explain screen</button>
      <button class="chip" onclick="chip('What should I do next?')">What next?</button>
      <button class="chip" onclick="chip('Summarize what is on screen')">Summarize</button>
      <button class="chip" onclick="chip('Find any errors or issues')">Find issues</button>
      <button class="chip" onclick="chip('How do I use this?')">How to use</button>
    </div>
    <div id="input-row">
      <textarea id="input" rows="1" placeholder="Ask anything… or press 🎤 to speak"
        onkeydown="onKey(event)" oninput="resizeInput(this)"></textarea>
      <button id="voice-btn" title="Hold to speak" onmousedown="startVoice()" onmouseup="stopVoice()">🎤</button>
      <button id="send-btn" onclick="send()">↑</button>
    </div>
    <div id="voice-status">🎙 Listening… release to send</div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────
let apiKey      = '';
let capture     = null;
let history     = [];
let isRecording = false;

// ── Init ───────────────────────────────────────────────────
(async () => {
  const cfg = await window.aria.getConfig();
  apiKey = cfg.apiKey || '';
  checkKey();

  greet();
  setupVoice();
})();

// Refresh config on focus (user may have changed settings)
window.addEventListener('focus', async () => {
  const cfg = await window.aria.getConfig();
  apiKey = cfg.apiKey || '';
  checkKey();
});

// Alt+Q triggered from main process → auto screenshot + ask
window.aria.onTriggerScreenshotAsk(() => {
  captureScreen(true);
});

function greet() {
  addMsg('ai', [
    "Hi, I'm <strong>Aria</strong> — your AI screen assistant ✦",
    "",
    "• Press <strong>📸 Capture</strong> to grab your screen",
    "• Press <strong>🎤</strong> (hold) to speak your question",
    "• Press <strong>Alt+Q</strong> anywhere to capture + ask instantly",
    "• Press <strong>🕓</strong> to browse past conversations",
    "",
    "<em>Alt+Space to show or hide me anytime.</em>"
  ].join('\n'));
}

function checkKey() {
  document.getElementById('api-banner').style.display = apiKey ? 'none' : 'block';
}

// ── Voice Input (MediaRecorder → Gemini transcription) ────
let mediaRecorder = null;
let audioChunks   = [];
let micStream     = null;

async function setupVoice() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    console.log('Mic permission granted');
  } catch (e) {
    console.warn('Mic permission denied:', e.message);
    document.getElementById('voice-btn').style.opacity = '0.3';
    document.getElementById('voice-btn').title = 'Microphone access denied';
  }
}

async function startVoice() {
  if (isRecording) return;
  if (!apiKey) { window.aria.openSettings(); return; }
  try {
    micStream     = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks   = [];
    mediaRecorder = new MediaRecorder(micStream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('voice-status').classList.add('show');
  } catch (e) {
    addMsg('ai', '⚠ Microphone blocked. Go to Windows Settings → Privacy → Microphone and allow access, then restart the app.');
  }
}

async function stopVoice() {
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  document.getElementById('voice-btn').classList.remove('recording');

  return new Promise((resolve) => {
    mediaRecorder.onstop = async () => {
      micStream.getTracks().forEach(t => t.stop());

      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      if (audioBlob.size < 500) {
        document.getElementById('voice-status').classList.remove('show');
        resolve(); return;
      }

      document.getElementById('voice-status').textContent = '✦ Transcribing…';

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                role: 'user',
                parts: [
                  { inlineData: { mimeType: 'audio/webm', data: base64Audio } },
                  { text: 'Transcribe exactly what is said in this audio. Return only the spoken words, nothing else.' }
                ]
              }]
            })
          });
          const data = await res.json();
          document.getElementById('voice-status').classList.remove('show');
          document.getElementById('voice-status').textContent = '🎙 Listening… release to send';
          if (data.candidates?.[0]) {
            const transcript = data.candidates[0].content.parts[0].text.trim();
            const inputEl    = document.getElementById('input');
            inputEl.value    = transcript;
            resizeInput(inputEl);
            setTimeout(() => send(), 150);
          }
        } catch (e) {
          document.getElementById('voice-status').classList.remove('show');
          document.getElementById('voice-status').textContent = '🎙 Listening… release to send';
          addMsg('ai', '⚠ Voice transcription failed. Check your API key and connection.');
        }
        resolve();
      };
      reader.readAsDataURL(audioBlob);
    };
    mediaRecorder.stop();
  });
}

// ── Screenshot ─────────────────────────────────────────────
async function captureScreen(autoAsk = false) {
  const btn = document.getElementById('cap-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Capturing…';
  const data = await window.aria.takeScreenshot();
  btn.disabled = false;
  btn.textContent = '📸 Capture';
  if (data) {
    capture = data;
    document.getElementById('scr-thumb').innerHTML = `<img src="${data}" alt="screen" />`;
    document.getElementById('scr-name').textContent = 'Screen ready — ask me anything!';
    if (autoAsk) {
      document.getElementById('input').value = 'Explain what you see on my screen.';
      send();
    }
  } else {
    document.getElementById('scr-name').textContent = '❌ Capture failed';
    addMsg('ai', '⚠ Screenshot failed. Please try:\n\n1. Go to **Windows Settings → Privacy & Security → Screenshots** and make sure screen capture is allowed\n2. If that doesn\'t work, install **Visual C++ Redistributable** from microsoft.com\n3. Try running Aria as Administrator (right-click → Run as administrator)');
  }
}

// ── Send ───────────────────────────────────────────────────
async function send() {
  if (!apiKey) { window.aria.openSettings(); return; }
  const inputEl = document.getElementById('input');
  const text    = inputEl.value.trim();
  if (!text && !capture) return;

  document.getElementById('send-btn').disabled = true;
  const userText = text || 'Please analyze my screen.';

  addMsg('user', userText, capture);

  const parts = [];
  if (capture) {
    parts.push({ inlineData: { mimeType: 'image/png', data: capture.split(',')[1] } });
  }
  parts.push({ text: userText });

  history.push({ role: 'user', parts });
  inputEl.value = '';
  resizeInput(inputEl);
  clearCapture();
  showTyping();

  try {
    const url  = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`;
    const body = {
      system_instruction: {
        parts: [{ text: "You are Aria, a professional AI assistant floating over the user's Windows screen. Help users understand their screen, navigate apps, debug errors, and be more productive. When given a screenshot, analyze it clearly and concisely. Be direct, brief, and actionable. Use plain text." }]
      },
      contents: history,
      generationConfig: { maxOutputTokens: 1024, temperature: 0.7 }
    };

    const res  = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    hideTyping();

    if (data.error) {
      addMsg('ai', `⚠ Gemini error: ${data.error.message}`);
      history.pop();
    } else {
      const reply = data.candidates[0].content.parts[0].text;
      history.push({ role: 'model', parts: [{ text: reply }] });
      addMsg('ai', reply);

      // Save to persistent history
      saveToHistory(userText, reply);
    }
  } catch (e) {
    hideTyping();
    history.pop();
    addMsg('ai', '⚠ Network error. Check your connection.');
  }

  document.getElementById('send-btn').disabled = false;
  inputEl.focus();
}

// ── Persistent history ─────────────────────────────────────
async function saveToHistory(userMsg, aiReply) {
  try {
    const existing = await window.aria.loadHistory() || [];
    existing.unshift({
      id:        Date.now(),
      timestamp: new Date().toISOString(),
      user:      userMsg,
      ai:        aiReply
    });
    // Keep last 100 conversations
    await window.aria.saveHistory(existing.slice(0, 100));
  } catch(e) {}
}

// ── UI helpers ─────────────────────────────────────────────
function addMsg(role, text, imgData) {
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');
  row.className = 'msg-row ' + role;
  const av = document.createElement('div');
  av.className = 'av ' + role;
  av.textContent = role === 'ai' ? 'AI' : 'You';
  const mw = document.createElement('div');
  mw.className = 'msg-wrap ' + role;
  if (imgData) {
    const badge = document.createElement('div');
    badge.className = 'scr-badge';
    badge.textContent = '🖥 Screen capture attached';
    mw.appendChild(badge);
    const img = document.createElement('img');
    img.src = imgData; img.className = 'img-thumb'; img.alt = 'Screen';
    mw.appendChild(img);
  }
  const bub = document.createElement('div');
  bub.className = 'bubble ' + role;
  bub.innerHTML = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,     '<em>$1</em>')
    .replace(/`(.*?)`/g,       '<code style="background:rgba(255,255,255,0.1);padding:1px 4px;border-radius:3px">$1</code>')
    .replace(/\n/g,            '<br>');
  mw.appendChild(bub);
  row.appendChild(av); row.appendChild(mw);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');

function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function clearCapture() {
  capture = null;
  document.getElementById('scr-thumb').textContent = '🖥';
  document.getElementById('scr-name').textContent  = 'No capture yet — press Capture or Alt+Q';
}

function chip(text) {
  const el = document.getElementById('input');
  el.value = text; resizeInput(el); el.focus();
}

function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

function resizeInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}
